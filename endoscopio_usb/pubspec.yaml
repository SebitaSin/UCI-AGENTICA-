name: endoscopio_usb
description: Visor para endoscopio USB con procesamiento de imagen avanzado
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  permission_handler: ^11.3.0
  path_provider: ^2.1.3
  wakelock_plus: ^1.2.5
  vector_math: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
